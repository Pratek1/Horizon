version: "3.9"

services:
  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: Horizon-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - Horizon-net

  # ── Node.js app ──────────────────────────────────────────────────────────────
  app:
    build: .
    container_name: Horizon-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Override the DB URL so the app reaches the mongo container, not localhost
      MONGO_URL: mongodb://mongo:27017/airbnb
      NODE_ENV: production
    depends_on:
      - mongo
    networks:
      - Horizon-net

volumes:
  mongo-data:

networks:
  Horizon-net:
